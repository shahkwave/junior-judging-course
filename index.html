<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junior Ring Judge's Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Direction: a judge's book. Ring-mat green structure, armband numerals, AKC placement ribbon colors as the progress language. One-column, phone first. */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --ink:#17231D; --muted:#566860; --line:#D0DAD2;
  --mat:#1F5A43; --mat-soft:#DDEBE2; --accent:#C23566; --accent-ink:#FFFFFF;
  --good:#1D7A4B; --good-bg:#E1F2E8; --bad:#B03C2C; --bad-bg:#F8E5E1;
  --band-bg:#FFFFFF; --band-ink:#111111;
  --r1:#E0709A; --r2:#7B4B2A; --r3:#8CC77A; --r4:#9AA3A0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1612; --surface:#16221C; --ink:#E7EFE9; --muted:#9BAEA4; --line:#2A3B31;
    --mat:#3C9672; --mat-soft:#1D3128; --accent:#E5628F; --accent-ink:#1A0A11;
    --good:#58C48C; --good-bg:#17301F; --bad:#F08A78; --bad-bg:#3A1D18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#16221C; --ink:#E7EFE9; --muted:#9BAEA4; --line:#2A3B31;
  --mat:#3C9672; --mat-soft:#1D3128; --accent:#E5628F; --accent-ink:#1A0A11;
  --good:#58C48C; --good-bg:#17301F; --bad:#F08A78; --bad-bg:#3A1D18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0 0 .85em}
ul,ol{margin:0 0 .9em;padding-left:1.2em}
li{margin-bottom:.35em}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* top bar */
.top{background:var(--mat);color:#fff;position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;background:none;border:0;color:#fff;cursor:pointer;padding:6px 0;text-align:left}
.nav{display:flex;gap:4px;overflow-x:auto}
.nav button{background:transparent;border:0;color:#fff;opacity:.82;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.nav button[aria-current="page"]{opacity:1;background:rgba(255,255,255,.18)}
.nav button:hover{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top :focus-visible{outline-color:#fff}

main{padding:22px 0 80px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(44px,12vw,72px);font-weight:800;text-transform:uppercase;margin:6px 0 12px}
.hero p{color:var(--muted);max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 4px;font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.03em}
.stats span b{font-weight:800;color:var(--mat)}

/* ring card */
.ringcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:18px 0 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ringcard .meter{flex:1 1 180px}
.meter .lab{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:15px;color:var(--muted)}
.bar{height:10px;background:var(--mat-soft);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--mat);border-radius:6px;transition:width .4s}
.ribbons{display:flex;gap:6px;align-items:flex-end}

/* module list */
.mods{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.mod{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:left;cursor:pointer}
.mod:hover{border-color:var(--mat)}
.band{flex:0 0 auto;min-width:54px;height:54px;display:grid;place-items:center;background:var(--band-bg);color:var(--band-ink);border:3px solid #111;border-radius:6px;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;padding:0 6px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.mod h3{font-size:24px}
.mod .sub{font-size:15px;color:var(--muted);line-height:1.35;margin-top:2px}
.mod .meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);letter-spacing:.03em;text-align:right;min-width:62px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:22px 0 0}
.tool{background:var(--mat);color:#fff;border:0;border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer}
.tool h3{font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.tool p{margin:4px 0 0;font-size:15px;opacity:.9;line-height:1.35}
.tool.alt{background:var(--surface);color:var(--ink);border:2px solid var(--mat)}
h2.sec{font-size:26px;text-transform:uppercase;letter-spacing:.03em;margin:26px 0 10px}

/* lesson */
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.crumb .band{min-width:46px;height:46px;font-size:28px}
.crumb h2{font-size:30px}
.link{background:none;border:0;color:var(--mat);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:6px 0}
.dots{display:flex;gap:6px;margin:6px 0 14px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--mat)}
.dots i.cur{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 10px}
.card h3{font-size:32px;margin-bottom:10px}
.card .body{font-size:18px}
.card b{font-weight:600}
.callout{background:var(--mat-soft);border-left:5px solid var(--mat);border-radius:6px;padding:10px 14px;margin:12px 0}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--mat);background:transparent;color:var(--mat);border-radius:8px;padding:10px 18px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.mat{background:var(--mat);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:hover:not(:disabled){filter:brightness(1.07)}

/* weights widget */
.wbars{display:grid;gap:8px;margin:6px 0 12px}
.wb{display:grid;grid-template-columns:1fr;gap:4px;background:none;border:0;text-align:left;cursor:pointer;padding:4px 0}
.wb .nm{font-size:16px;line-height:1.2;display:flex;justify-content:space-between;gap:8px}
.wb .nm b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.wb .tr{height:22px;background:var(--mat-soft);border-radius:4px;overflow:hidden}
.wb .tr i{display:block;height:100%;border-radius:4px}
.wb[aria-pressed="true"] .nm{color:var(--accent)}
.t-drive i{background:var(--mat)} .t-reward i{background:#6C9B85} .t-gate i{background:#9AA3A0}
.wdesc{min-height:3.4em;font-size:16px;color:var(--muted);margin:0 0 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.03em;margin:4px 0 8px}
.legend s{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;text-decoration:none}

/* drill + details + table */
.drill .q{font-family:var(--display);font-size:24px;font-weight:700;margin:12px 0 8px}
.choices{display:grid;gap:8px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;font-size:17px;line-height:1.4;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--mat)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--mat);background:var(--mat-soft)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt .k{font-family:var(--display);font-weight:800;margin-right:8px}
.why{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:17px}
.why.ok{background:var(--good-bg);border-left:5px solid var(--good)}
.why.no{background:var(--bad-bg);border-left:5px solid var(--bad)}
.why .v{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:2px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0}
details>summary{cursor:pointer;padding:12px 14px;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15;list-style:none;display:flex;gap:10px;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:26px;color:var(--mat);line-height:1}
details[open]>summary::after{content:"\2212"}
details .in{padding:0 14px 8px;font-size:17px}
.in h5{margin:8px 0 4px;font-family:var(--display);font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.in h5.l{color:var(--good)} .in h5.f{color:var(--bad)} .in h5.n{color:var(--muted)}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:16px;min-width:520px}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:15px;color:var(--muted)}
td:first-child{font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:16px;color:var(--muted);margin-bottom:6px}
.qtext{font-size:21px;line-height:1.35;font-weight:600;margin:6px 0 14px}
.result{text-align:center;padding:22px 16px}
.result .pct{font-family:var(--display);font-weight:800;font-size:84px;line-height:1}
.result .place{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.05em;margin:6px 0}
.miss{border-left:5px solid var(--bad);background:var(--surface);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:16px}
.miss b{display:block;font-weight:600}
.ok-line{color:var(--good)}
.breakdown{display:grid;gap:6px;margin:8px 0}
.bd{display:grid;grid-template-columns:34px 1fr 52px;gap:10px;align-items:center;font-size:16px}
.bd .band{min-width:34px;height:34px;font-size:22px;border-width:2px}

/* flashcards */
.fc{perspective:900px}
.fcard{min-height:240px;display:grid;place-items:center;text-align:center;background:var(--surface);border:2px solid var(--mat);border-radius:14px;padding:22px;cursor:pointer;width:100%;position:relative}
.fcard .tag{position:absolute;top:10px;left:14px;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.fcard .txt{font-size:23px;line-height:1.35}
.fcard.back{background:var(--mat);color:#fff}
.fcard.back .tag{color:#d5e8dd}
.fcard.front .txt{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.pill{font-family:var(--display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:16px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--mat);background:var(--mat-soft)}
.hint{font-size:15px;color:var(--muted);text-align:center;margin-top:8px}
.scen-t{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){body{font-size:17px}.mod{flex-wrap:wrap}.mod .meta{flex-direction:row;margin-left:68px;gap:10px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" data-go="home">Junior Ring Course</button>
  <nav class="nav" aria-label="Course sections">
    <button data-go="home" id="n-home">Course</button>
    <button data-go="cards" id="n-cards">Cards</button>
    <button data-go="scenarios" id="n-scenarios">Rings</button>
    <button data-go="exam" id="n-exam">Exam</button>
  </nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<script>
/* ---------- COURSE DATA (part 1: modules 1-5) ---------- */
function Q(p, c, w, why){ return { p:p, c:c, w:w, why:why }; }

const WEIGHTS = [
  { n:"Correct & Breed-Specific Presentation", w:30, tier:"drive",  d:"Stack and movement set up correctly for the breed and this individual dog, with the dog treated as a partner." },
  { n:"Highlight Virtues & Minimize Faults",   w:15, tier:"drive",  d:"Choosing angles, speed and positions that show strengths and hide weaknesses without altering the dog's natural stance or gait." },
  { n:"Efficiency in Motion",                  w:15, tier:"drive",  d:"Smooth, purposeful handling: quick correct set-ups, clean transitions, tools managed without interruption." },
  { n:"Ability to Follow Directions",          w:12, tier:"reward", d:"Accurate patterns, attentiveness, and reading implied or unspoken cues from the judge." },
  { n:"Overall Handling Style",                w:12, tier:"reward", d:"Composure, professionalism, connection with the dog, tidy lead and tool management, clean age-appropriate attire." },
  { n:"Safety",                                w:10, tier:"gate",   d:"Safe spacing, control, no scooping or shoving, proper bait use, dog kept on the mat." },
  { n:"Sportsmanship",                         w:5,  tier:"gate",   d:"Kindness to the dog, courtesy to officials and competitors, grace in winning and losing." }
];
const TIERS = {
  drive:  "Drives placement",
  reward: "Rewards poise / breaks ties",
  gate:   "Pass-fail modifier"
};

const CATS = [
  { n:"Correct & Breed-Specific Presentation (30%)",
    look:["Dog set up correctly for the breed: front feet under the shoulders, rear showing proper angulation, head, expression, topline and tail suited to the breed","Efficient, balanced stack (hand or free) without fussing","Smooth starts and stops in gait, natural head carriage, breed-appropriate speed","Correct exam surface, dog straight at the edge of the mat","Gentle touch and an engaged partnership"],
    fault:["Posting, A-framing, gooseneck, broken topline, under-stacked or over-stretched","Repeated resets that the dog's movement didn't cause","Not noticing a foot that moved","Jerky or lunging starts and stops, dragging, the sling-shot turn","Wrong speed or gait (such as pacing) not recognized","Yanking, or using feet and knees on the dog (excessive force is grounds for dismissal)","Disconnected from the dog"],
    neutral:["A difficult dog earns no automatic credit; skillful, patient problem-solving can","A push-button dog earns no automatic penalty, but a dog that self-corrects while the junior is unaware does","Breed difficulty is never a factor","Confidence never outweighs correctness","Unfamiliar presentation is not wrong if it is consistent and structurally correct"] },
  { n:"Highlight Virtues & Minimize Faults (15%)",
    look:["Showcase angles that favor strengths (profile if the head is weak, head-on if the rear is weak)","Speed that shows correct movement","Body position that draws the eye to the best features","A clean, unobstructed side view in a corner showcase"],
    fault:["Handling that calls attention to a fault (stroking a weak topline)","Moving too fast or too slow","Erratic starts, stops, turns","Sitting by a weak rear instead of toward the front","A showcase at a poor angle, or one that blocks the judge's view"],
    neutral:["A glaring fault the junior cannot hide is not penalized if the effort to minimize it is thoughtful","An outstanding dog is not a reward in itself"] },
  { n:"Efficiency in Motion (15%)",
    look:["Dog set quickly and correctly, neither rushed nor tentative","Exam set-up with no wasted motion; adjust only what needs adjusting","Swift transitions: exam to gait to stop","Lead tension released or lead moved out of view","Tools handled without hesitation"],
    fault:["Excessive time or unnecessary resets","Fumbling lead or bait, dropped tools","Rough or jerky motions","Excessive courtesy turns","Abrupt stops, overshooting the mat, stopping too close to or far from the judge","Bait or body blocking the judge's view"],
    neutral:["If the dog moves and the junior fixes it quickly, there is no penalty (dogs are not robots)","If the junior's own faulty set made the position unsustainable, a penalty can fit"] },
  { n:"Ability to Follow Directions (12%)",
    look:["Ready and attentive with the dog presented when the exam starts","Accurate pattern with smooth turns and proper speed","Tracks where the judge is standing","Reads implied cues (a head-on gesture, or continuing to show until the judge moves on)"],
    fault:["Inattentive; judge has to signal twice","Wrong or incomplete pattern","Starting before instructions finish","Missing showcase points or angles","Ignoring implied direction","Continuing to showboat against an instruction"],
    neutral:["Asking for clarification is fine unless the junior simply wasn't listening","Keeping the dog engaged during a 'relax on the line' is fine; showboating is not"] },
  { n:"Overall Handling Style (12%)",
    look:["Composure and relaxed confidence","Natural movement that doesn't distract","Clear cues; the dog responds willingly","Bait used with purpose and actually given as a reward","Lead neatly wound and held in the hand","Clean, professional, age-appropriate clothing"],
    fault:["Extra moves for their own sake, such as waving bait that cannot motivate the dog","Poor posture, bounce, heavy feet","Forced eye contact with the judge","Checked out or disconnected from the dog","Dropped bait, bait on the table, constant feeding right before the bite exam, misused squeaky toy","Dangling or finger-wrapped lead","Sloppy or inappropriate attire","Reaching into undergarments for bait is discouraged"],
    neutral:["Movement style may be sharp or fluid if it is clear and consistent","Expensive attire gets no extra credit","Smiling, talking, energy: a handling contest, not a relationship contest","True play is shared and lifts the dog; ambush 'play' is imposed and diminishes it"] },
  { n:"Safety (10%)",
    look:["Safe spacing on entry, in class and on exit","Adjusting when re-ordered","Control at all times","Bait, toys and play used respectfully","Dog stays on the mat","Safe footwear and clothing"],
    fault:["Scooping or plopping a small dog into place","Shoving or body-blocking a large dog","Crowding or cutting off others","Distracting other teams (squeaky toys, thrown or dropped food)","Loose collar, wrong placement, stringing up the dog","Unaware of the effect on others","Cutting corners or leaving the mat"],
    neutral:["Table-checking is encouraged, but omitting it isn't automatically penalized and a performative check isn't rewarded","Lead-off exams are acceptable for skilled teams, but any loss of control weighs more heavily"] },
  { n:"Sportsmanship (5%)",
    look:["Calm kindness toward the dog","Courtesy to judge, steward and competitors","Polite acknowledgment of instructions","Congratulating others or offering help"],
    fault:["Harsh correction or scolding, especially if the dog turns shy","Rude behavior or language","Casual acknowledgments such as 'yep' or 'uh-huh'","Visibly upset when passed over","Self-centered behavior (cutting in line, arguing for position)","Intentional interference (heavy penalty, even excusal)","Arguing with officials"],
    neutral:["Not congratulating winners isn't a fault in itself, but eye-rolling, muttering or throwing ribbons is","Smiling and eye contact are not required; the junior just shouldn't look angry, confused or bored"] }
];

const MODS = [

/* ===================== 1 ===================== */
{ id:1, title:"Purpose of the Ring", sub:"What Junior Showmanship measures, and who the judge is meant to be",
  lessons:[
   { title:"What you are really judging", html:`
     <p>The AKC Junior Showmanship program serves youth <b>ages 9 through 18</b>. It exists to build knowledgeable, skilled, sportsmanlike dog people, so the focus is the <b>handler's presentation skill</b>, not the dog's quality.</p>
     <div class="callout"><b>Purpose in one line.</b> Evaluate the handler's skill in presenting a DOG to its best advantage, with technical ability and a positive, respectful attitude toward the dog and other participants.</div>
     <p>A junior's overall performance includes:</p>
     <ul><li>Correct, breed-appropriate presentation</li><li>Highlighting virtues and minimizing faults</li><li>Following the judge's guidance and ring procedure</li><li>A trusting partnership with the dog</li><li>Sportsmanship, in the ring and outside it</li></ul>` },
   { title:"The judge as mentor", html:`
     <p>Junior judging carries an <b>educational responsibility</b>. You pick the most skilled handlers, and you also model what good handling and good sportsmanship look like.</p>
     <ul><li>Placements tell juniors, parents and coaches what wins. Reward the wrong thing and everyone watching learns it.</li><li>Corrections are made quietly and respectfully (covered in Module 8).</li><li>Feedback is specific and usable (covered in Module 10).</li></ul>
     <div class="callout">Keep this phrase in mind through the whole course: <b>“The standard you tolerate is the standard juniors will learn to meet.”</b></div>` },
   { title:"Partner, not prop", html:`
     <p>Every category in the standard comes back to the relationship between junior and dog. The dog is a <b>valued partner</b> whose needs are understood and honored, never a prop used to get a result.</p>
     <p>But skill and relationship have to appear together:</p>
     <ul><li>A flawless technical run with no direction, praise or reinforcement, even when the dog is seeking guidance, is <b>disconnected</b>.</li><li>A warm bond with no technical skill is <b>no more desirable</b> than technique with no connection.</li><li>It is a <b>handling contest, not a relationship contest</b>. A quiet, introverted junior with better presentation should not lose to one who simply looks like they are having more fun.</li></ul>` },
   { title:"Find correctness first, then sort", html:`
     <p>In the breed ring you find the dogs of correct type, then sort by other attributes. In Juniors, find the <b>team with the correct presentation</b>, then sort on everything else.</p>
     <p>The guide's stacking example: two juniors stop, set up and present with the same speed, efficiency and confidence. One shows a slightly posted front, a poor head position, and a tail presentation that reveals a low tail set. The other fixes all three. The motions look similar, but the quality of execution is different.</p>
     <div class="callout"><b>Confidence is not a substitute for correctness.</b> A confident handler presenting incorrectly is still incorrect.</div>
     <p>By the Open level, most juniors have the basics, so placements hinge on subtleties. Train your eye to see them.</p>` }
  ],
  quiz:[
   Q("What is the main thing a Junior Showmanship judge evaluates?","The handler's skill in presenting the dog to its best advantage",["Which dog is closest to its breed standard","The junior's enthusiasm and personal charisma","How many wins the dog already has"],"The stated purpose is the handler's skill in presenting a dog to its best advantage, with a positive and respectful attitude."),
   Q("Two juniors move into position equally fast and confidently. One stacks with a posted front and a visible low tail set; the other has corrected both. Who is stronger on this element?","The one who corrected the faults",["The one who got set up first","The one who made stronger eye contact with you","Neither, since speed and confidence were equal"],"Execution quality is the difference. Confidence is not a substitute for correctness."),
   Q("A quiet junior with a more correct presentation is in your class with a bubbly junior who is smiling and talking to the dog constantly but handles less accurately. Which approach fits the guide?","Reward the more correct handling, as long as the quiet junior still shows a positive partnership",["Reward the bubbly junior, because enjoyment shows partnership","Tie them, since personalities differ","Penalize the quiet junior for lack of expression"],"The guide calls this a 'handling contest, not a relationship contest.' Smiling and chatter are individual traits, and excess talking can even signal nerves."),
   Q("Which performance best matches the guide's idea of a 'disconnected' junior?","A technically sound run with no direction or praise, even though the dog keeps seeking attention",["A junior who is quiet but cues the dog clearly","A junior working a young, green dog who needs frequent resets","A junior using a loose lead on a breed shown that way"],"Technically sound handling with no relationship, no direction, praise or reinforcement is the disconnected picture."),
   Q("Beyond selecting winners, what extra responsibility does the guide place on a Junior Showmanship judge?","Acting as a mentor and role model",["Acting as the junior's coach during the class","Enforcing the breed standard for each dog","Ranking juniors by potential for future success"],"Judges 'serve as mentors and role models,' fostering confidence, learning and a positive competitive environment."),
   Q("How does the guide describe the basic sorting strategy for a close class?","Find the team with the correct presentation first, then sort by the other elements",["Sort by the junior's age and class first","Start with sportsmanship, then break ties on presentation","Rank the most animated team first"],"It parallels the breed ring: correct type first, then other attributes.")
  ]
},

/* ===================== 2 ===================== */
{ id:2, title:"The Seven Categories", sub:"The weights, how they work together, and what each rewards and faults",
  lessons:[
   { title:"The weights", type:"weights", html:`
     <p>Tap a bar to see what it covers. The seven categories sum to <b>99%</b>; the guide rounded them for simplicity. If you want the missing 1%, <b>relationship and partnership with the dog</b>, which appears in almost every category, is the element to give it to.</p>` },
   { title:"How the weights work together", html:`
     <p>The percentages are not just arithmetic. The guide describes three jobs:</p>
     <ul>
      <li><b>Placement drivers:</b> Correct &amp; Breed-Specific Presentation, Highlighting Virtues/Minimizing Faults, and Efficiency in Motion. These define true skill and knowledge and should drive your placements.</li>
      <li><b>Poise and tie-breakers:</b> Following Directions and Overall Handling Style reward exceptional poise and professionalism. They can decide how placements are distributed, or break ties between equally skilled handlers.</li>
      <li><b>Pass/fail modifiers:</b> Safety and Sportsmanship. Exceptional, egregious or repeated behavior can take an otherwise talented handler out of the running.</li>
     </ul>
     <div class="callout">The top three categories total 60%, but their real power is bigger than the number: they decide who is skilled. Safety and Sportsmanship total only 15%, but serious problems can knock out a polished handler.</div>` },
   { title:"Practice: sort the categories", type:"tierdrill", html:`
     <p>Assign each category to the job it does in your decision-making.</p>` },
   { title:"Look-fors, faults and neutral points", type:"cats", html:`
     <p>Open each category for a compact view of what the guide rewards, faults, and says <b>not</b> to penalize or credit automatically. The neutral points matter as much as the faults; many exam questions turn on them.</p>` }
  ],
  quiz:[
   Q("What is the weight of Correct & Breed-Specific Presentation?","30%",["15%","12%","25%"],"It is the heaviest category at 30%."),
   Q("Which two categories are each weighted 12%?","Ability to Follow Directions and Overall Handling Style",["Safety and Sportsmanship","Efficiency in Motion and Highlighting Virtues","Following Directions and Safety"],"Following Directions and Overall Handling Style are both 12%."),
   Q("The weights add up to 99%. If you want to account for the missing 1%, what does the guide suggest?","Relationship and partnership with the dog",["Attire and personal appearance","The quality of the dog","The junior's age"],"Relationship/partnership is mentioned in nearly every category and is the suggested element."),
   Q("Which three categories should drive your placements?","Correct Presentation, Highlighting Virtues/Minimizing Faults, Efficiency in Motion",["Following Directions, Handling Style, Safety","Safety, Sportsmanship, Handling Style","Correct Presentation, Handling Style, Sportsmanship"],"The first three define true skill and knowledge."),
   Q("How should Safety and Sportsmanship function in your thinking?","More like pass/fail modifiers: egregious, repeated or exceptional behavior can take a skilled handler out of the running",["Equal partners with Correct Presentation","Pure tie-breakers used only when everything else is equal","They only matter for the Best Junior decision"],"They act as modifiers rather than as heavy scoring categories."),
   Q("A junior keeps stroking a dog's weak topline throughout the class. Which category is this mainly a fault under?","Highlight Virtues & Minimize Faults",["Safety","Ability to Follow Directions","Sportsmanship"],"Handling that calls attention to a fault is listed as a fault under Highlight Virtues & Minimize Faults."),
   Q("A junior has a dog with a glaring structural fault they cannot hide, but handles thoughtfully to minimize it. What is the right approach?","Do not necessarily penalize; credit the thoughtful effort to minimize the fault",["Penalize heavily, since the fault is visible","Ignore handling and place by dog quality","Reward the junior extra for the challenge automatically"],"Not every junior has a top-quality dog. The guide says not to penalize if the junior makes every effort to minimize the fault. Likewise, an outstanding dog is not itself a reward."),
   Q("A well-set dog moves a foot because a loud noise startles it, and the junior corrects it quickly. What does the guide say about penalties?","No penalty, since dogs are not robots, unless the junior fails to correct it",["Penalize for wasted motion","Penalize in Safety","Penalize only if it happens twice"],"Under Efficiency in Motion, a quick, effective correction of a dog's reaction is neutral. Failure to correct, or an incorrect original set, may be penalized.")
  ]
},

/* ===================== 3 ===================== */
{ id:3, title:"Correctness Before Preference", sub:"Technical execution first; breed-specific style is a secondary layer",
  lessons:[
   { title:"The core principle", html:`
     <p><b>Technical correctness must come before stylistic or other choices.</b> A junior should never be penalized or rewarded for style alone when the technical execution doesn't support it.</p>
     <p>Technical correctness includes:</p>
     <ul><li>A dog consistently presented in a balanced, controlled, correct profile</li><li>Ring awareness, timing and control</li><li>Informed decisions that result in the best presentation of <i>this</i> dog</li><li>Clean transitions and the ability to recover when something goes wrong</li><li>A supportive partnership that helps the dog succeed</li></ul>
     <p>Breed-specific presentation is a <b>secondary layer</b>, evaluated only after technical competence has been established.</p>` },
   { title:"Free stack vs hand stack; loose vs firm lead", html:`
     <p>When more than one method is acceptable for a breed, judge the <b>quality of the execution, not the method</b>.</p>
     <ul>
      <li>A free stack that produces a correct, stable outline beats a hand stack that never quite settles.</li>
      <li>A clean, efficient, correct hand stack beats a free stack that is inconsistent, badly timed or badly angled.</li>
      <li>Choosing a hand stack doesn't excuse repeated struggle; choosing a free stack doesn't excuse lost control or poor angle.</li>
      <li>A loose lead is only optimal if it produces correct gaiting. A lead with light consistent contact beats a loose one that loses timing and connection.</li>
      <li>A firm lead that restricts movement or nearly lifts the dog loses to firm-but-not-tight contact that guides the dog smoothly.</li>
     </ul>
     <div class="callout">Only when presentations are equally clean and technically correct may a judge consider breed-specific stylistic preference as a <b>secondary factor</b>.</div>` },
   { title:"When the breed standard speaks", html:`
     <p>Some standards define presentation; most presentation choices are only implied or shaped by tradition. If a standard clearly defines a method, you must account for it. The guide gives three examples:</p>
     <ul>
      <li><b>German Shepherd Dog:</b> the standard calls for the dog to be shown at a trot on a loose lead. A moderate pace on a visibly loose lead that gives smooth, rhythmic movement is more correct than a faster, flashier trot with lead tension.</li>
      <li><b>Doberman Pinscher:</b> shown square, alert and balanced. Precision usually points toward hand-stacking, but the standard doesn't mandate one method and presentation can vary by dog.</li>
      <li><b>Afghan Hound:</b> 'stands naturally.' Continual hand-stacking can interfere, but small, purposeful adjustments to a free stack should not be penalized.</li>
     </ul>
     <p><b>Bottom line:</b> when technical execution and breed-appropriate presentation conflict, technical correctness prevails.</p>` },
   { title:"Unfamiliar does not mean wrong", html:`
     <p>If a junior consistently presents something you don't recognize, and the result is structurally correct, <b>assume they are correct</b>.</p>
     <div class="callout"><b>The Beagle ears example.</b> A judge from an erect-ear breed sees a Beagle junior dropping the dog's ears. The Beagle standard calls for a soft, pleading expression, which dropped, relaxed ears support. Unless you know for sure, treat it as neutral.</div>
     <ul><li>A junior showing in a non-traditional way should ideally show a short piece of the traditional presentation first, then move to what flatters the dog.</li><li>Some juniors do a traditional stack in the individual exam and a more supported variation on the line, where other dogs are close and the stack must be held longer.</li><li>The beagle standard doesn't dictate one stack, and in the guide's lineup, a 'traditional' stack with an A-framed dog shouldn't be rewarded over correct non-traditional ones.</li></ul>` },
   { title:"Difficult dogs, push-button dogs", html:`
     <ul>
      <li><b>Difficult dog:</b> no automatic extra credit. But a junior who stays calm, positive and keeps problem-solving may be showing tremendous skill, possibly more than a junior on a seasoned dog who adds nothing and uses no breed-specific technique.</li>
      <li><b>Never</b> assume one breed is harder than another.</li>
      <li><b>Push-button dog:</b> making it look easy is a desirable skill. Don't speculate about training. But if the dog self-corrects while the junior is unaware, or compensates for the junior's mistakes, judge the <b>junior's actual contribution</b>.</li>
      <li>The dog standing or moving incorrectly isn't penalized by itself. Failing to recognize and correct it is. Frustration or impatience is a handler issue even when the dog is the one misbehaving.</li>
      <li>Hand-stacking and free-stacking breeds require equal skill. Neither is harder.</li>
     </ul>` }
  ],
  quiz:[
   Q("What is the core principle of 'Correctness Before Preference'?","Technical correctness must come before stylistic or breed-tradition choices",["The most traditional presentation should always win","Confidence outranks technical correctness","Breed-specific style is judged first, then technique"],"Breed-specific style is a secondary layer evaluated after technical competence."),
   Q("In a breed where hand-stacking is common, two juniors free-stack and achieve a correct, stable outline. A third hand-stacks the usual way but never settles the dog. Which is stronger on this element?","The two free-stackers, because execution matters more than method",["The hand-stacker, because it is the breed norm","All three are equal","The hand-stacker, because it is more difficult"],"Judges evaluate the quality of execution, not the method chosen."),
   Q("Junior A uses light but consistent lead contact and produces smooth movement. Junior B tries a looser lead typical of the breed but loses timing and connection. Who is stronger on this element?","Junior A",["Junior B, because a loose lead is traditional","Neither, since both are valid choices","Junior B, because it is harder to do well"],"A loose lead is only optimal if it can produce the correct gaiting presentation."),
   Q("The German Shepherd Dog standard calls for movement at a trot on a loose lead. Junior X moves faster with lead tension and looks flashy; Junior Y moves at a moderate pace on a visibly loose lead with smooth rhythm. Who has the more correct presentation?","Junior Y",["Junior X, because flashier movement shows more skill","Neither; speed and lead tension are only style","Junior X, because speed demonstrates control"],"When the standard defines the method, judges prioritize standard-defined presentation over exaggerated motion."),
   Q("The Afghan Hound standard says the dog 'stands naturally.' How does that shape your evaluation?","Excessive continual hand-stacking may interfere, but small purposeful adjustments aren't penalized",["Any touching of the dog is a fault","Hand-stacking should be rewarded for precision","Free-stacking is mandatory"],"The key phrase is 'stands naturally.' A junior who resists overhandling may be more correct, while thoughtful minor corrections are fine."),
   Q("A Beagle junior consistently presents with the dog's ears dropped, and you come from an erect-ear breed. What should you do?","Treat it as neutral unless you know for sure, because the Beagle standard calls for a soft, pleading expression",["Penalize it as incorrect expression","Ask the junior to change it","Reward it, since it's unusual"],"If you aren't familiar with the breed's presentation, do not penalize what may be correct."),
   Q("A junior is calmly and positively working a dog that clearly wants to leave the ring. The other junior is on a well-seasoned dog and adds minimal direction. What can you do?","You can reasonably place the first junior above, because they showed skill and problem-solving",["Place the seasoned-dog junior above because the result is closer to perfect","Place the dogs by difficulty alone","Ignore dog behavior entirely"],"The guide says the path to the result matters, and working a challenging dog skillfully is a skill."),
   Q("A dog self-corrects its stack while the junior is unaware and not leading the correction. How should you evaluate it?","Judge the junior's actual contribution, which may be lacking",["Reward the junior, since the dog is correct","Ignore it as luck","Penalize the dog's training"],"A dog that self-corrects or compensates for incorrect handling may indicate a lack of effective handling."),
   Q("A dog paces in the down and back. When is the junior NOT necessarily penalized?","When the pacing wasn't caused by the junior's entrance choice and they recognize it and restart correctly",["Never; pacing is always a handler fault","Only if the dog is a toy breed","Only if the junior is a Novice"],"Penalty applies if the junior caused it or fails to recognize and correct it.")
  ]
},

/* ===================== 4 ===================== */
{ id:4, title:"Technique Before Style: On the Move", sub:"Body position, lead hand, pace, distance and purpose",
  lessons:[
   { title:"The handler's body tells a story", html:`
     <p>Breed-specific presentation doesn't end when the dog leaves the stack. A junior's body position, lead hand, pace, stride, distance and carriage form a picture during movement.</p>
     <p>The guide's exercise: look at two juniors without their dogs. One has a low, steady lead hand and purposeful stride (you picture a Hound or Terrier). The other is more upright with a higher, softer hand (you picture a Toy breed). Put a Beagle on each, and the first picture fits the dog; the second looks delicate and disconnected.</p>
     <div class="callout">Variation is not the same as <b>contradiction</b>. The junior's body should make sense with the dog. The handler's movement should tell the same story as the dog's.</div>` },
   { title:"Five things to watch", html:`
     <ul>
      <li><b>Body position:</b> too far behind looks pulled; too far ahead drags or hurries the dog; crowding inward interferes with front movement; drifting away loses control and adds lateral pressure; leaning forward looks like running downhill.</li>
      <li><b>Lead hand:</b> the hand must produce the correct result. It must not lift the dog, change head carriage, shorten the stride or pull in. Don't reward high or low hands just because tradition associates them with a group.</li>
      <li><b>Pace and stride:</b> the right pace is natural and fluid, without rushing, lagging, pulling or restraining. Short choppy steps disrupt a ground-covering dog; a big running stride can overwhelm a small one. Quiet, light footfalls. If you hear the handler before you see the dog, it isn't ideal.</li>
      <li><b>Distance from dog:</b> intentional. Too close crowds and hides movement; too far weakens control or adds lead tension.</li>
      <li><b>Forward purpose:</b> confident and directional, not rushed, stomping or dragging, and not tentative either.</li>
     </ul>` },
   { title:"Beware caricature and choreography", html:`
     <p>Don't reward a caricature of breed-specific handling, or of 'junior style':</p>
     <ul>
      <li>Leaning dramatically forward with a Hound, or floating with an unnecessarily high hand beside a zigzagging Toy, doesn't show more knowledge.</li>
      <li>Exaggerated leaping or floating transitions (the 'junior gait') are not a natural gait.</li>
      <li>Forced eye contact and rehearsed 'check-ins' at set points in a pattern are often taught without the junior knowing why.</li>
     </ul>
     <p>Checking in is fine when it confirms an instruction or tells the junior where you are, so they can showcase well. It earns nothing just for happening at a prescribed spot. If your eye goes to the handler before the dog, the dog is not being presented optimally.</p>` },
   { title:"Familiar is not the same as effective", html:`
     <p>Don't give automatic credit to a presentation just because it resembles what you see in the breed ring, and don't penalize an unfamiliar variation merely because it differs from your preference. But don't swing so far that you ignore body position, which affects balance, pace, lead tension, visibility, freedom of movement, control and team cohesion.</p>
     <div class="callout"><b>The question to ask:</b> Does this junior's body position, lead management, pace and stride create an appropriate and technically effective presentation of <i>this</i> dog? Not: Does this junior move the dog the way I would?</div>
     <p>In the guide's three-junior example, one handler out-moves her dog with downhill-skier lean and wide arms, causing the dog to gooseneck. Another is a bit ahead, seeming to pull the dog. A third matches the dog's stride but has a clawed lead hand. No single moment decides placement, but a moment may <b>eliminate</b> a candidate if everything else is equal.</p>` }
  ],
  quiz:[
   Q("A junior with a beagle moves with a very light, high hand and delicate floating stride suitable for a toy dog. What is the concern?","The junior's body position is in contradiction with the dog, giving a less cohesive picture",["Any high hand is a fault","Toy-style movement is always acceptable on any breed","Nothing; body position is irrelevant to the evaluation"],"Variation is acceptable but contradiction isn't; the junior's movement should tell the same story as the dog's."),
   Q("A junior runs too far ahead of the dog. What is the likely effect?","They may drag the dog forward or cause it to hurry",["The dog will appear more elegant","It improves reach and drive","It has no effect on movement"],"Too far ahead pulls the dog; too far behind looks pulled by the dog."),
   Q("How should a judge treat lead hand height?","Judge by the result; neither a high nor a low hand earns credit just because tradition links it to a breed group",["High hands are for Toys and should be rewarded there","Low hands always show better control","Lead hand height is never relevant"],"The hand position must produce the correct result without lifting, shortening stride or creating tension."),
   Q("Which is a sign that a junior's movement may be too much?","You notice the junior more than the dog, or hear them coming",["The junior moves quietly with light footfalls","The pace matches the dog's natural rhythm","The junior's off hand rests naturally"],"If you notice the handler's movement more than the dog's, it may not be the ideal picture."),
   Q("When is a junior's 'check-in' with the judge acceptable?","When it serves a purpose, such as confirming an instruction or learning where you are standing",["When performed at each corner no matter what","When done with prolonged eye contact","Whenever it looks polished"],"It earns nothing just for occurring at a prescribed point and shouldn't be dramatic or forced."),
   Q("In the guide's example of the junior with downhill-skier lean and wide arms, what problem appears in the dog?","Excessive speed causing the dog to gooseneck",["The dog paces","The dog sits repeatedly","The dog leaves the mat"],"The exaggerated forward motion leads to excess speed, causing the dog to slightly gooseneck."),
   Q("What question should the judge ask about body position and lead management?","Does it create an appropriate and technically effective presentation of this dog?",["Does it match how I handle this breed?","Does it resemble what the top breed-ring handlers do?","Does it look dramatic from ringside?"],"That is the guide's 'better question.'"),
   Q("Why might one poor moment matter even though no single moment decides placement?","It can eliminate someone from your candidates when everything else is equal",["It always drops a junior to last","It should never matter at all","It only matters in the Best Junior class"],"The guide notes that a moment may eliminate someone if everything else is equal up to movement.")
  ]
},

/* ===================== 5 ===================== */
{ id:5, title:"Placements & Fairness", sub:"From evaluation to ribbons, and the Best Junior procedure",
  lessons:[
   { title:"Who deserves Best Junior", html:`
     <p>Choose the <b>most skilled and complete handler</b>, not the most enthusiastic, charismatic or 'promising' one. A positive attitude and good sportsmanship should be expected. They shouldn't outweigh handling merit, and winners should have both.</p>
     <p>None of these should influence placements:</p>
     <ul><li>Age or size of the junior</li><li>Experience level or class</li><li>Personality</li><li>The breed presented</li><li>Perceived potential</li><li>How often they show, who handles for them, or how familiar their face or dog is</li></ul>
     <p>The guide's example: a 9-year-old Novice who has shown since age 3 and a 17-year-old Open Senior who started recently. Placing the younger one ahead simply for being 'good for their age' is wrong. Placing them ahead for better skill is a valid award.</p>` },
   { title:"Consistency across classes", html:`
     <ul>
      <li>If two Master Juniors are the best handlers that day, they win. Don't 'spread the wealth'; year-end recognition and scholarships rest on accumulated points.</li>
      <li>Don't default to Masters either; they may not be the best that day.</li>
      <li>No sympathy placements for Open Seniors who might be in their last big show.</li>
      <li>No rewarding Novices or Open Juniors for showing promise.</li>
     </ul>
     <div class="callout"><b>The heart-dog exercise.</b> Your own dog has just won the Group in Orlando and must go into Best in Show now; only your juniors are available. Who would you hand the lead to? Not the cheerful but less skilled; not the confident one who never got the dog stacked quite right; not the technically correct one who is frustrated when the dog isn't perfect; not the one whose handling gets more urgent under pressure. You pick consistent confidence, solid technique, and a harmonious partnership that brings out the best in the dog.</div>
     <p>Encourage potential <b>after</b> judging, by inviting the junior to talk with you, not through placements.</p>` },
   { title:"Order of awards", html:`
     <p>Best Junior and Reserve Best Junior follow a process like Winners and Reserve Winners in the breed ring.</p>
     <ol>
      <li><b>Select Best Junior Handler</b> from the class winners who returned. Use whatever individual or group exercises you consider fair.</li>
      <li><b>Invite the eligible reserve competitor:</b> the second-place junior from the <i>same class</i> as the newly named Best Junior joins the remaining class winners.</li>
      <li><b>Evaluate for Reserve:</b> run the <i>same exercises</i> and the same criteria, then pick the one who most closely approaches the skill and presentation of your Best Junior.</li>
     </ol>` },
   { title:"Know your priorities", html:`
     <p>Juniors value consistency. If you are clear about what you reward and then reward it every time, juniors know what to showcase in your ring.</p>
     <p>The guide's sample statement of priorities (a section the author notes is still being finalized, pending permission to post such statements) includes:</p>
     <ul><li><b>Present your dog, not yourself:</b> correct breed-specific presentation, highlighting strengths, smooth efficient handling, right speed and timing, quiet supportive handling.</li><li><b>Professionalism and ring awareness:</b> accurate response to directions, confident clear handling, respectful partnership, discreet bait use, correct tool use.</li><li><b>Safety:</b> spacing, bait never thrown or placed on the floor or table (and any dropped bait picked up immediately), safe table, ramp and floor exams, control and awareness of other teams.</li></ul>` }
  ],
  quiz:[
   Q("Which of these may legitimately influence a Best Junior decision?","The junior's actual handling skill demonstrated in your ring that day",["The junior's age and 'good for their age' performance","The junior's frequent appearances at shows","The junior's perceived future potential"],"Judge only the skills presented in your ring on that day."),
   Q("A 9-year-old Novice with six years of experience competes against a 17-year-old Open Senior who is newer to the ring. Which reasoning is acceptable?","Place whichever shows the better handling skills that day",["Place the younger ahead because they are 'good for their age'","Place the older ahead because they are in a higher class","Place both equally and flip a coin"],"Age or size has no bearing; skill does."),
   Q("What is the first step in the Best Junior / Reserve Best Junior procedure?","Select Best Junior Handler from the class winners who returned",["Select Reserve Best Junior first","Invite the second-place junior from every class","Ask each class winner to pick a partner"],"Best Junior is chosen first, followed by the reserve process."),
   Q("After Best Junior is named, who becomes eligible to compete for Reserve?","The second-place junior from the same class as Best Junior",["The class winner with the next-highest points","Any junior in the ring who wishes to enter","The class winner from the next-largest class"],"The second-place winner from the Best Junior's class returns to join the remaining class winners."),
   Q("When evaluating for Reserve Best Junior, which exercises should you use?","The same exercises and movement pattern used for the Best Junior evaluation",["A more difficult pattern","Only a stacked comparison","A new set of exercises chosen at random"],"Consistent criteria ensure fairness and integrity."),
   Q("Two Master Juniors are clearly your best handlers. What should you do?","Award them Best and Reserve; their prior accomplishments don't count against them",["Place a lower class winner to 'spread the wealth'","Move them down because they have enough wins","Ask them to compete again with a harder pattern"],"Year-end recognition depends on accumulated points; judges don't redistribute wins."),
   Q("You notice an exceptionally promising young junior who still needs polish. How should you encourage them?","Invite them to speak with you afterward and offer a compliment or constructive guidance",["Place them higher as encouragement","Give them Best Junior to build confidence","Mention it to the class during judging"],"Encouragement belongs after judging, not through placements.")
  ]
}
];

{ id:6, title:"Running the Ring", sub:"Entry, organization, required elements, cuts and the cardinal rules",
  lessons:[
   { title:"Entry, late arrivals and early exits", html:`
     <ul>
      <li><b>Calling the class:</b> typically in catalog order, with time and space to enter safely. Do a <b>visual headcount</b> and verify armbands against the judge's book or steward's list.</li>
      <li><b>Late arrivals:</b> juniors juggle multiple rings. Be flexible: you may allow entry <b>as long as cuts or placements have not begun</b>, especially if the junior communicated the conflict or is visibly at the gate. Late entry is not a fault. Give them every required element and the same evaluation.</li>
      <li><b>Leaving the ring:</b> a junior may be excused on request, but must be told <b>they cannot re-enter the class</b>. Handle it calmly with no commentary. If it happens during another team's presentation, offer that team a re-do.</li>
     </ul>
     <p>Evaluation starts at the gate: polite to the steward when picking up the number, no cutting in line, calm dog on entry. A parent or mentor can help a younger junior pick up an armband.</p>` },
   { title:"Organizing and sorting", html:`
     <p>Your first job is deciding how to organize the class.</p>
     <ul>
      <li><b>Resort by size and gait speed</b> in most rings. Self-sorting suits small, experienced classes (Open, Masters). Direct the sort for large, mixed or Novice classes.</li>
      <li>Resort when dog size or speed varies greatly, when ring congestion limits evaluation, or when the initial order prevents fair movement.</li>
      <li>Resort promptly with clear instructions. Avoid repeated reshuffling.</li>
      <li><b>Split</b> the class into smaller groups when entries are large or the ring is small. Consider dog size, gait speed and equipment needs (grouping table and ramp breeds reduces equipment movement).</li>
     </ul>` },
   { title:"Required elements and consistency", html:`
     <p><b>Every class includes, at minimum:</b></p>
     <ul><li>Group movement</li><li>Individual examination</li><li>Individual movement</li><li>Group presentation (stacked on the line)</li></ul>
     <p><b>Optional:</b> an individual showcase presentation, and group comparative exercises (fronts, expression, rears).</p>
     <p><b>Consistency:</b> if the show offers <i>levels</i> (Master, Open, Novice), every junior in a level gets the same pattern. If it offers <i>classes</i> (Novice Junior, Open Senior and so on), the pattern is consistent within each class. It may differ between levels or classes.</p>
     <p>Discouraged for safety: walking behind juniors (especially between junior/dog and the ring gate), and placing hands on table or ramp breeds while the dog is on the floor.</p>` },
   { title:"Cuts, instructions, equipment, awards", html:`
     <ul>
      <li><b>Cuts:</b> pull <b>at least four</b> from each group so a group with all your top placements isn't disadvantaged. Pulled juniors return together for final comparison. With huge entries you may cut from your cuts. Aim for a final group of <b>at least six</b>, so placements of 1st through 4th still leave non-placed juniors exiting with someone.</li>
      <li><b>Instructions:</b> clear, concise, audible to all; check that juniors at the end of the line can hear. Don't give materially different instructions to individuals unless it's for safety. Pause to confirm understanding in Novice or younger classes.</li>
      <li><b>Furniture:</b> avoid moving juniors past in-ring equipment, plan for table/ramp entry and removal, use discretion on ramp-optional breeds, and brief your steward in advance.</li>
      <li><b>Making awards clear:</b> pull placed juniors to the center or a distinct side, and make your picks obvious by pointing, or naming breeds (“the Beagle is first”). Never gesture vaguely.</li>
     </ul>` },
   { title:"The cardinal rules", html:`
     <p><b>You MUST:</b></p>
     <ul><li>Move the class as a group (resort by speed/size so this is safe)</li><li>Examine and move every team individually, with the same pattern within the class</li><li>Be aware of timing</li><li>Make clear placements</li><li>Mark your book correctly</li></ul>
     <p><b>You must NEVER:</b></p>
     <ul><li>Run juniors past in-ring equipment</li><li>Move the class without resorting when needed</li><li>Walk on the off-side of the juniors (between them and the ring gate); stay to the center of the ring</li><li>Examine or touch table or ramp breeds on the ground (including line-up re-touches)</li><li>Ask for complex patterns in Best Junior. No triangles or L's; keep patterns appropriate to the lowest class, often Novice.</li></ul>
     <p><b>BE CAUTIOUS about rewarding:</b> poor bait or tool management, harsh handling, interference or showboating. A polished performance should never outweigh unsafe handling, poor sportsmanship, or behavior that harms another team.</p>` },
   { title:"Start to finish: every phase counts", type:"phases", html:`
     <p>You are evaluating continuously, not just during the individual exam. Ring management moments are <b>evaluative, not neutral</b>. No single moment should outweigh consistent, accurate performance across the whole class.</p>` }
  ],
  quiz:[
   Q("Which set lists the minimum required elements of every class?","Group movement, individual exam, individual movement, group presentation",["Individual exam, showcase, group comparative, awards","Group movement, triangle pattern, individual movement, showcase","Individual exam, individual movement, ribbons, group comparative"],"Showcase and comparative exercises are optional."),
   Q("A show offers classes (Novice Junior, Novice Intermediate, Open Senior and so on). What does the guide require about patterns?","They must be consistent for every junior within a class, but may vary between classes",["Every class must use the same pattern","Each junior may choose their own pattern","Patterns may vary from junior to junior within a class"],"When offering classes, the pattern is consistent within each class."),
   Q("When making cuts from multiple groups, how many juniors should you pull from each group at minimum?","At least four",["At least two","Exactly six","Only the class winner"],"Pulling at least four avoids disadvantaging exhibitors when top competitors are concentrated in one group."),
   Q("Why does the guide recommend a final group of at least six?","So that 1st through 4th can be awarded and non-placed juniors don't exit alone",["Because the AKC requires six","To make sure each breed is represented","To shorten the time per junior"],"Non-ribboned juniors walk out with at least one other exhibitor."),
   Q("A junior arrives at the gate late because of a conflict in another ring, and you have not yet made cuts. What may you do?","Allow the junior to enter and give them the same required elements",["Refuse entry because the class has started","Allow entry but skip the individual exam","Penalize them one placement"],"Judges may allow entry as long as cuts or placements have not begun."),
   Q("A junior asks to leave the ring mid-class. What must you make clear?","Once excused, they may not re-enter the class",["They may re-enter at the end of the class","They will be penalized in the Best Junior class","They must ask the AKC representative first"],"This keeps ring integrity and fairness."),
   Q("Which is a MUST NEVER?","Gait juniors past tables or ramps positioned in the ring",["Resort a class by dog size","Make cuts from each group","Use a steward to move equipment"],"Walk them past equipment or remove it before gaiting at speed."),
   Q("Where should the judge stand while the class is moving or during exams and group evaluations?","In the center of the ring, never on the off-side between the juniors and the ring gate",["Behind the line of juniors","Between juniors and the gate so the dogs are visible","Wherever is closest to the steward"],"Do not walk on the off-side of the juniors."),
   Q("In the Best Junior class, which pattern is acceptable?","A simple pattern appropriate for the lowest class, such as a down and back",["A triangle to separate the top handlers","An L pattern","A reverse triangle"],"Triangles and L's are not allowed for Best Junior; keep patterns appropriate for your lowest class."),
   Q("During the group line-up, a dog is struggling to hold a prolonged stack. How should you evaluate the junior?","Don't penalize the dog's difficulty; reward calm, adaptive support over urgency or repeating what isn't working",["Penalize for the dog's lack of training","Ignore the junior entirely","Reward the junior who keeps repeating the same cue"],"Adapting, reading the dog and moving to Plan B is valuable, while urgency and harshness signal over-focus on winning."),
   Q("When should you direct the sorting rather than allow self-sorting?","For large, mixed-experience or Novice classes, or when safety requires firm guidance",["When the class is small and experienced","Never; juniors always self-sort","Only in the Best Junior class"],"Self-sorting may suit small, experienced classes like Open or Masters."),
   Q("Which describes how you should make your placement selections?","Obvious to juniors and audience, for example by naming breeds or pulling to a distinct spot",["A subtle nod toward the junior","Handing ribbons without announcing","Waiting until all juniors have left the ring"],"There is nothing worse than a judge's vague gesture leaving a junior unsure whether they were chosen.")
  ]
},

/* ===================== 7 ===================== */
{ id:7, title:"Patterns & Fair Instructions", sub:"Down and back, triangle, L, showcase, and instructions that give every junior a fair chance",
  lessons:[
   { title:"Pattern guide", type:"patterns", html:`
     <p>The purpose of an individual pattern is to see how effectively the handler presents the dog's structure and movement while keeping control, awareness and breed-appropriate presentation. Tap a pattern for details.</p>` },
   { title:"What to look for in any pattern", html:`
     <p><b>Look for:</b></p>
     <ul><li>Clear understanding of the pattern</li><li>Smooth transitions between set-up and movement</li><li>Speed right for breed, dog and ring size</li><li>The dog positioned between handler and judge</li><li>Straight, purposeful path and balanced stop</li><li>Dog kept on the mats, especially in corners</li></ul>
     <p><b>Don't reward:</b></p>
     <ul><li>Mechanical or exaggerated gestures</li><li>Stringing up or racing the dog for animation</li><li>Jerky corrections or tight leads</li><li>Abrupt starts, stops or transitions</li><li>Theatrics, handler between dog and judge</li><li>Cutting corners or leaving mats (a safety issue, especially on slick surfaces)</li></ul>` },
   { title:"Showcase variations", html:`
     <ul>
      <li><b>Implied:</b> “go around to the end of the line.” The junior should know you are still watching and keep showing until you've clearly moved on.</li>
      <li><b>Designated:</b> “go around and showcase in the corner.” Keep the corner clear, and tell juniors on the line not to interfere.</li>
      <li><b>After a group line-up:</b> one at a time to a designated spot.</li>
      <li><b>Part of Best Junior:</b> a down and back with no stop, going on around to present in the corner. This tests whether juniors adapt (does anyone automatically free-stack at the end of the back?).</li>
      <li><b>Mid-pattern:</b> down, halfway back, showcase, around. Make sure dogs of all sizes can complete it safely.</li>
     </ul>
     <p>Asking for a <b>showcase</b> rather than a <b>free stack</b> avoids disadvantaging juniors whose breeds are not traditionally free-stacked.</p>` },
   { title:"Same instruction is not the same opportunity", html:`
     <p>Treating everyone identically is not the same as treating everyone fairly.</p>
     <ul>
      <li><b>“Free stack your dog.”</b> This favors breeds naturally trained to free-stack (Collie) over hand-stacked breeds (Basset). It's also ambiguous: is tail support allowed for an Afghan?</li>
      <li><b>“Go down and halfway back and show a side profile across the width of the mat.”</b> A small dog has room; a large dog may be forced to leave the mat, crowd a turn or miss the profile. Fine on a solid surface like carpet, dirt or grass.</li>
      <li><b>“Present a side profile and keep moving.”</b> If the dog doesn't stop correctly, do they show what the dog offers and go, or fix it? An experienced dog succeeds by luck, while a puppy's junior may be penalized for doing it properly.</li>
     </ul>
     <div class="callout"><b>Before you give instructions ask:</b> What am I trying to evaluate? Can every junior and breed reasonably show that skill? Are my instructions complete and clear (when to stop, how long, whether to adjust, when to continue)? Am I rewarding skill or circumstance?</div>` }
  ],
  quiz:[
   Q("Which pattern shows movement going away, on the side and returning?","Triangle",["Down and back","Reverse triangle","Showcase pattern"],"The triangle's purpose is to showcase movement going away, on the side and coming back."),
   Q("Which classes does the guide recommend the triangle for?","Masters or Open",["Novice only","All classes equally","Best Junior"],"It is a slightly more difficult pattern."),
   Q("What is the guide's note on the reverse triangle?","It is advanced and NOT a recommended pattern, to be used only when appropriate",["It is the standard Open pattern","It is required in Best Junior","It is easier than the triangle"],"Only for Masters or experienced Open classes, and the guide marks it as not recommended."),
   Q("In a triangle, a junior moves the dog to their right side for the return leg and you have a clear view. What does the guide say?","Not penalized, provided they transition smoothly afterward",["Penalized for changing sides","Penalized only in Masters","Disqualified from the pattern"],"This presentation can keep the dog's movement steadier and shouldn't be penalized."),
   Q("During a down and back, a junior lines themselves up with the judge instead of lining up the dog. What is this?","A fault: the dog should be placed directly in the judge's line of sight",["Correct technique","Only a fault for large dogs","A neutral variation"],"Not placing the dog in line with the judge is listed under 'Judges Should Not Reward.'"),
   Q("You say “go around to the end of the line” and watch a junior's dog all the way there. What should the junior do?","Keep showing until you've clearly moved on to the next dog",["Relax, since the pattern is over","Look away to avoid staring","Ask whether to stack"],"Reading the implied direction is part of Following Directions."),
   Q("Why can “free stack your dog” create an uneven playing field?","It favors breeds trained to free-stack and may be interpreted differently by different juniors",["It is too easy for every breed","It is only used in Masters","It is prohibited by the AKC"],"The same instruction doesn't create the same opportunity, and juniors must guess your meaning."),
   Q("You ask juniors to show a side profile across the width of the mat. What is the risk with large dogs?","They may not have room to do it without leaving the mat",["It makes the pattern too easy","Small dogs can't do it","There is no risk"],"This may be fine on a solid surface, but on mats a large dog can't always achieve the profile safely."),
   Q("A junior cuts corners and takes the dog off the mat onto a slick surface. How is this treated?","As a safety concern that you should not reward",["As a harmless shortcut","As good efficiency in motion","As a neutral style choice"],"It appears under 'Judges Should Not Reward' for any pattern."),
   Q("Before designing an exercise, what should the judge decide first?","Exactly which handling skill is being evaluated",["Which pattern the juniors know best","How impressive it will look from ringside","Which breed will do it best"],"Then check that every junior has a reasonable opportunity to show that skill.")
  ]
},
