{ id:8, title:"Safety, Bait & Physical Handling", sub:"What to stop, what never to reward, and how to say it",
  lessons:[
   { title:"Safety faults in the ring", html:`
     <ul>
      <li><b>Scooping, plopping or dropping</b> a small dog into place, especially from a height. Never drop a dog into position.</li>
      <li><b>Body-blocking or shoving</b> a large dog. Lead the dog into position, then adjust. Using the full body, feet or legs to push or brace is faulted.</li>
      <li><b>Crowding or cutting off</b> others: stopping too close, running up on the dog ahead in group movement, and especially running up on small dogs at the end of the line.</li>
      <li><b>Distracting others:</b> squeaky toys, excessive baiting or talking, thrown or dropped food.</li>
      <li><b>Unsafe collar or lead technique:</b> collar too loose or wrongly placed; stringing up a dog, especially if it coughs or chokes.</li>
      <li>Being unaware of the effect on others (or intentionally interfering).</li>
      <li>Leaving the mat or cutting corners; unsafe clothing or footwear.</li>
     </ul>` },
   { title:"Bait", html:`
     <p>Bait is a legitimate tool. Don't penalize using bait; judge <b>how</b> it's managed.</p>
     <ul>
      <li><b>Throwing bait is never allowed</b> in juniors, in or out of the ring. It can start fights, make dogs lunge, and trip handlers. The guide gives examples of bait landing between two waiting Terriers, and three large dogs lunging for a piece thrown during a fronts check.</li>
      <li><b>Not on the table or ramp:</b> crumbs and scent distract the next dog, especially scent hounds and small dogs.</li>
      <li><b>Not on the ground as a target</b> for the dog in the line-up.</li>
      <li><b>Bait as a tool, not a prop:</b> purposeful position and timing. Waving bait at a dog who isn't looking is habit, not handling. Recognizing it isn't working and moving to Plan B (voice, touch, movement, a toy) is the real skill.</li>
      <li><b>Reward the dog:</b> constantly promising bait and never delivering will lose the dog's attention.</li>
      <li><b>“They do it in the breed ring” is not a reason.</b> Juniors are a developmental program, and other juniors may not have the skill to cope when bait lands near their dogs.</li>
      <li><b>Storage:</b> a pouch, pocket or armband is fine and shouldn't be penalized for being visible. Reaching into undergarments is discouraged for juniors; a junior's comfort and dignity are never a handling fault.</li>
     </ul>
     <p>If a junior throws bait: calmly stop it, ask them to retrieve it safely, remind them bait stays in the hand or goes directly to the dog. For example: “Could you please go pick-up your bait as it could be a safety issue? Thank you.” Repeated behavior counts in procedure, sportsmanship and ring awareness, and severe repeated cases may lead to excusal after warnings.</p>` },
   { title:"Feet and body cues", html:`
     <p>Footwork and body position are legitimate cues: shifting weight, opening or closing space, subtle pressure. Using a foot or knee to <b>physically make a dog move</b> is not. That includes pushing a hip, sliding a front foot, tapping the stomach, or stomping at the dog.</p>
     <ul>
      <li>These actions are quick and hidden. <b>Watch the whole ring</b> with peripheral vision, change where you stand, and look back at the class unexpectedly.</li>
      <li>A junior who harshly manipulates or intimidates a dog this way <b>should not win and probably should not be in the ribbons</b>.</li>
      <li>Consider nature, severity and frequency. An accidental bump differs from deliberate use of a foot or knee. Minor but intentional: don't reward. Repeated, forceful or intimidating: address it, possibly speaking with the junior after judging, involving a parent or the show committee, or taking further action if welfare is a concern.</li>
      <li>Excessive force is grounds for dismissal.</li>
     </ul>
     <div class="callout">“Ignoring inappropriate handling teaches the junior that the behavior works. Rewarding it teaches every junior watching that it is acceptable.” Watch for it. Recognize it. Do not reward it.</div>` },
   { title:"Table, ramp and lead safety", html:`
     <ul>
      <li><b>Table check:</b> juniors should quickly confirm stability before placing the dog, because conditions change between dogs. It should be subtle and fluid. Doing it earns no automatic credit; omitting it isn't an automatic penalty. A performative check (repeated pushing, staring at you) can affect the evaluation. Noticing an unstable table and handling it well shows judgment.</li>
      <li><b>Table positioning:</b> as far forward and toward the judge's side as the junior can <b>safely and effectively control</b>. A smaller junior or an anxious dog may need a position closer to the handler. Judge safety, control, accessibility and correct profile, not distance from the edge.</li>
      <li><b>Leads:</b> excess lead neatly wound and held in the hand. Wrapping a lead around the hand, wrist or fingers is a safety concern because a lunge can injure the handler.</li>
      <li><b>Lead or collar off for the exam:</b> acceptable for skilled teams in the right breed. No automatic credit, no automatic penalty, but loss of control is weighed <b>more heavily</b> because the junior chose to give up that control.</li>
     </ul>` },
   { title:"Correcting in the ring", html:`
     <p>Juniors are learning. Correct unsafe or unsportsmanlike behavior in a way that protects dignity and keeps the class fair.</p>
     <ul>
      <li><b>Address the behavior, not the child</b>. Keep a calm, conversational tone and keep it brief and instructional.</li>
      <li>Correct privately or quietly when possible and apply the same standard to everyone.</li>
      <li>Then <b>continue judging</b>. Don't revisit unless it continues.</li>
      <li><b>Set expectations early</b> with a short opening announcement (spacing, attention to the dog, safe bait use, sportsmanship), so later corrections can refer back to it.</li>
      <li><b>Line-watch:</b> while examining one junior, keep monitoring the rest for nose-to-tail dogs, tightening leads, crowding, distracted handlers, and young juniors needing more room. Preventive phrases: “Everyone take one step apart.” “Let's give the next team just a little more room.”</li>
      <li><b>Safety first:</b> if there is immediate risk to anyone, intervene immediately even if it interrupts judging.</li>
     </ul>` }
  ],
  quiz:[
   Q("A junior throws bait during the line-up and it lands near the next dog. What is the first step?","Calmly stop the behavior and ask them to retrieve the bait safely",["Excuse the junior immediately","Ignore it and continue","Announce the junior's name to the audience"],"Stop it, retrieve it safely, briefly remind them. Repeats and severe cases may lead to excusal after warnings."),
   Q("Why is leaving bait on a table or ramp a problem?","It can distract the next dog, especially scent hounds and small dogs",["It makes the table unstable","It is just untidy","It slows the judge's exam"],"Scent, crumbs and residue may make the next dog sniff, lick or search."),
   Q("A junior waves bait continuously at a dog that isn't looking at it. What does the guide say this shows?","Habit rather than handling skill; the real skill is recognizing it isn't working and adjusting",["Good bait management","Excellent engagement","A safety fault only"],"Bait is a tool, not a prop. Plan B might be voice, touch, movement or a toy."),
   Q("Someone defends a bait throw by saying “they do it in the breed ring.” What is the guide's position?","That is not sufficient; Junior Showmanship is a developmental program and other juniors may not handle the risk",["It should be allowed for experienced juniors","It is acceptable if the dog catches it","It should be allowed in Masters only"],"The standard you tolerate is the standard juniors will learn to meet."),
   Q("A junior uses a visible bait pouch rather than reaching into clothing to retrieve bait. How should you treat this?","Do not penalize; a junior's comfort and dignity are never a handling fault",["Penalize for a less polished silhouette","Ask them to hide the pouch","Reward them for professionalism automatically"],"Judge the skill with which bait is managed, not how invisible the storage is."),
   Q("During your examination of one dog, you notice a junior nudging their dog's hip with a foot to set it. What does the guide say?","Don't reward it; deliberate harsh physical manipulation should not win and probably shouldn't be in the ribbons",["Ignore it as normal handling","Reward it if the stack is correct","Warn only after the class is over"],"Feet and knees are not training tools. Consider severity, intent and frequency."),
   Q("What is the guide's concern with a lead wrapped around a junior's fingers?","It's a safety risk, as a lunge can cause serious injury and the lead can't be released",["It looks unprofessional only","It blocks the judge's view","It is only a problem on a table"],"Excess lead should be neatly wound and held in the hand."),
   Q("A junior removes the lead for the individual exam and the dog moves unexpectedly, causing a loss of control. How is this weighed?","More heavily, because they chose a technique that requires greater control",["Less heavily, because the technique is advanced","The same as for a dog on lead","Not at all"],"Any loss of control is a significant deficiency when the junior voluntarily removed a means of restraint."),
   Q("A smaller junior places a Beagle farther from the judge's side of the table because of limited reach, but the dog is stacked crooked. What should be faulted?","The crooked stack, not the table position",["The table position","Both equally","Neither"],"The guide says she should not be penalized for the safer position; the error is failing to stack squarely."),
   Q("How should a correction normally be delivered?","Quietly and briefly, addressing the behavior rather than the child, then continue judging",["Publicly, to set an example","As a long lecture to the whole ring","By having the steward handle it"],"A single quiet sentence is often more effective than a lengthy lecture."),
   Q("Which is the best way to reduce corrections later in the class?","Set expectations early with a brief announcement to all juniors",["Wait and correct each junior individually","Rely on the steward to explain","Remove the junior who first breaks a rule"],"Early expectations let you refer back to them without singling anyone out.")
  ]
},

{ id:9, title:"Exams Surface by Surface", sub:"Stacking technique, table, ramp, floor and oral-exam wording (Exhibits A and B)",
  lessons:[
   { title:"General stacking technique", html:`
     <p>The general technique, which applies to all breeds, runs in a set order:</p>
     <ol>
      <li><b>Front feet first, then rear feet.</b></li>
      <li><b>Left front with the left hand; right front with the right hand.</b> Both rears are set with the left hand.</li>
      <li>Fronts are lifted from the <b>elbow</b>; rears are lifted at the <b>hock</b>.</li>
      <li><b>Head control</b> is maintained throughout the set-up.</li>
     </ol>
     <p>Result: front feet appropriately wide, rear showing proper angulation, natural head, appropriate topline, correct expression/ear set and tail carriage. Lead is draped out of the way, wound in the hand, or at a suitable length for a free stack. The dog is never left entirely unsupported.</p>
     <p><b>Common faults:</b></p>
     <ul><li>Moving a slightly-back foot <b>forward</b> to straighten (it is generally better to move the most forward foot back, since the first often causes posting)</li><li>Not changing hands for the front feet</li><li>Fronts too wide/close; rears under-stacked or over-stretched</li><li>Reaching under to set feet (except for some larger breeds)</li><li>Setting both fronts at once (some small toys excepted)</li><li>Hovering or leaning into the dog's space, blocking the judge</li><li>Unsteady head while setting rear feet</li><li>Resetting every foot the same way every time, which shows pattern knowledge, not evaluation</li><li>Wrong bite presentation, or feeding bait just before the bite exam</li></ul>` },
   { title:"Table breeds", html:`
     <p><b>Correct:</b> quiet table check; safe two-handed lift; dog near the front edge and as close to the judge's side as can be <b>safely and effectively controlled</b>; dog square; junior positioned for easy adjustment; controlled removal (no swinging; collar placed for control before setting down); dog confident and comfortable.</p>
     <p><b>Faults:</b></p>
     <ul><li>Dramatic or performative table check</li><li>Unsafe or rushed lift on or off; dropping the dog harshly</li><li>Dog too far back, too near the edge, or too far from the junior to control</li><li>Dog not square</li><li>Over-baiting, crowding, constant repositioning</li><li>Letting go of the dog completely; lead dangling in front or blocking your view</li><li>Releasing the dog before you've finished and moved away</li><li>Bait or grooming tools placed on the table</li></ul>` },
   { title:"Ramp breeds", html:`
     <p><b>Correct:</b> approach the ramp calmly and straight on; light, even lead pressure; all feet on the flat top before stacking; dog placed where weight is best distributed, over the ramp supports and in the middle. <b>On the ramp, centered weight matters more than the front or the judge's side.</b> Junior steps aside to give you access; guides the dog down until all feet reach the ground.</p>
     <p><b>Faults:</b></p>
     <ul><li>Rushing or pulling the dog up</li><li>Dog off-center so weight isn't balanced</li><li>Dog allowed to jump off the side</li><li>Handler between you and the dog</li><li>Dog too far back</li><li>Leaning over the dog</li><li>Over-baiting or sharp tugs to get the dog onto the ramp</li><li>Lunging descent</li></ul>` },
   { title:"Floor breeds", html:`
     <p><b>Correct:</b> controlled approach to the exam position; dog stacked at the edge of the mat closest to you, straight and aligned; the junior guides and stops the dog so little adjustment is needed; natural head and expression; fronts and rears set without feet or knees under the dog; clear, unobstructed side and front views; lead excess gathered neatly (not dangling, which disrupts the outline in juniors even if seen in the breed ring).</p>
     <p><b>Faults:</b></p>
     <ul><li>Dog crooked on the mat or angled wrongly</li><li>Junior standing or baiting directly in front, blocking the view</li><li>Dog off the mat, or fidgeting without need</li><li>Head pulled unnaturally high, or posted from an over-extended rear</li><li>Messy lead</li><li>Wrong stance for breed</li><li>Bumping or pushing to set the rear</li><li>Bait use so heavy that the dog shifts while chewing</li></ul>` },
   { title:"Ringside quick reference: equipment and oral exams", html:`
     <ul>
      <li><b>Keep the ring clear:</b> less furniture is safer and faster.</li>
      <li><b>Ramp-optional breeds:</b> you needn't bring a ramp in if the breed's permitted alternate surface is available. You <b>must</b> provide the ramp for ramp-mandatory breeds. If a class has both, the ramp is already in the ring and you may let the junior choose or assign the surface.</li>
      <li><b>Oral exam wording:</b> avoid “show me the bite,” “show me the teeth,” or “open the mouth,” which may give away what the junior should know. Use a neutral request: “Please present your oral exam appropriate for your breed,” “Oral exam, please,” or “Show me the oral exam, please.” (Some juniors take instructions very literally.)</li>
      <li><b>Exam codes:</b> Front (F), Front and Sides (F/S), Front and Open (F/O), Front, Sides and Open (F/S/O), or Thumb (T).</li>
      <li><b>Thumb exam (T) breeds:</b> the junior demonstrates or explains the presentation. You don't perform it, and the junior shouldn't substitute opening the mouth.</li>
     </ul>` }
  ],
  quiz:[
   Q("In the general stacking technique, which feet are set first?","Front feet, then rear feet",["Rear feet, then front feet","Both at once","Whichever the dog offers"],"General technique is front first, then rear."),
   Q("Which hand sets the left front foot?","The left hand",["The right hand","Either, depending on the breed","The hand holding the lead, always"],"Left front with left hand, right front with right hand."),
   Q("Where should a front foot be lifted from, and where a rear foot?","Front: the elbow. Rear: the hock",["Front: the wrist. Rear: the stifle","Both: the paw","Front: the shoulder. Rear: the hip"],"Fronts are set by lifting from the elbow; rears from the hock."),
   Q("A dog's rear foot is slightly back. What is generally better?","Move the most forward foot back to match",["Move the back foot forward","Move both forward","Leave it and re-bait"],"Moving the slightly-back foot forward often results in posting."),
   Q("On a ramp, which positioning concern outranks being near the front or judge's side?","Centered, balanced weight distribution",["Being closest to the judge","Facing the gate","Placing the dog at the far end"],"Weight distribution is more important on the ramp than front-of-ramp or judge's side."),
   Q("A ramp-optional breed is entered. Must you bring in a ramp?","No, if the breed's alternate permitted surface is available",["Yes, always","Only for Masters","Only if the junior asks"],"You must provide the ramp for ramp-mandatory breeds."),
   Q("Which wording is best for asking for the bite?","“Oral exam, please”",["“Show me the teeth”","“Open the mouth”","“Show me the bite”"],"Neutral wording avoids telling the junior which exam the breed needs."),

{ id:10, title:"Professional Responsibilities", sub:"Feedback, conflicts of interest, spectators, administration, timing and readiness",
  lessons:[
   { title:"Giving feedback", html:`
     <p>Offer brief, educational comments after class when asked, especially for Novice and newer juniors. Reinforce what they did well and give <b>what you'd like to see</b>, not just what went wrong. Focus on skill and execution, not personal evaluation.</p>
     <p>Examples of reframing:</p>
     <ul>
      <li>“You moved too fast” becomes “Work on finding a good speed for your dog that keeps the topline level and the movement balanced.”</li>
      <li>“You blocked my view” becomes “You showed calm control. Watch that the lead doesn't cross in front of the head.”</li>
      <li>“You crowded the team in front” becomes “Beautiful teamwork. Give yourself a little more space from the dog in front.”</li>
     </ul>
     <p><b>Avoid:</b></p>
     <ul>
      <li><b>“Smile more,” “have fun,” “you seemed nervous,” “show more personality.”</b> They aren't actionable and can penalize introverted, anxious or neurodivergent juniors. Tie it to a handling skill instead (for example, more connection and engagement with the dog).</li>
      <li><b>Comments on attire,</b> except for a safety concern (slippery shoes, hair blocking vision). If something is truly inappropriate, address it respectfully through the accompanying adult.</li>
      <li><b>Criticizing a junior for the dog they were given.</b> If a small child can't safely manage a large powerful dog, speak with the parent, guardian or coach about safer options.</li>
     </ul>
     <p>If a very strong junior asks for feedback and you saw no technical faults, say so, and explain that the decision came down to very fine details, like one team's movement catching your eye a little more. For whole-class feedback (common in Novice), give one or two sentences of praise plus one or two broadly useful items. Keep individual critiques until judging is finished.</p>` },
   { title:"Conflicts of interest", html:`
     <p>You must maintain actual <b>and perceived</b> impartiality. Recuse or excuse a junior if you have:</p>
     <ul><li>Mentored, trained, or handled/assisted them under your guidance</li><li>Owned, co-owned, lived with, bred, bred-to, leased, campaigned or handled the dog</li><li>An immediate family or household connection</li><li>A supervisory or coaching role in the same local club or training group</li><li>Given paid or volunteered handling lessons (excluding junior workshops at shows)</li><li>A close personal relationship (frequent socializing, travel, setting up together, family friendship)</li></ul>
     <p><b>Best practice:</b> if unsure, err toward caution. You may set stricter personal boundaries than the AKC. The standard is whether <i>a reasonable person could question whether impartiality might be compromised.</i></p>
     <p><b>How:</b> disclose expectations early. If such a junior enters, tell the class to relax, call the AKC Representative to help excuse them, or, if unavailable, pull the junior aside and explain. You can show the audience there is nothing wrong by inviting them to the center, shaking hands, and sending them out with applause.</p>` },
   { title:"Spectators, applause and the Field Representative", html:`
     <ul>
      <li><b>Coaching from ringside</b> (verbal, visual or gestural) isn't permitted once the class begins, and juniors shouldn't look ringside for direction. You can issue a general verbal warning. Balance this for novices: a parent quietly reminding a new junior about spacing or collar position for safety is different from presentation coaching, which should be highly discouraged.</li>
      <li><b>Clap for one, clap for all:</b> applause is offered equally, typically while teams move, at the end of a class or after placements. Favoritism cheering isn't appropriate. A brief opening announcement helps.</li>
      <li><b>Call the AKC Field Representative and/or Show Chair</b> for: a potential conflict of interest; a junior who can't safely control their dog; a bitch in season (halt the class and excuse the junior, which violates the regulations); inappropriate conduct by parents, spectators or others. A witness protects the junior, the judge and the integrity of the program.</li>
     </ul>` },
   { title:"Administration and timing", html:`
     <ul>
      <li><b>Check in</b> with the Superintendent well before your time. Confirm ring, start time and the breed breakdown. If you are Provisional and scheduled to be observed, find the AKC Representative early. Look at the breeds entered so you can arrange equipment.</li>
      <li><b>Working with your steward:</b> brief them on how you'll run the class, where to place the initial line-up, and equipment timing. The steward manages the gate, armbands, absences, equipment and ribbons. The steward must not coach juniors, tell them what you look for, suggest patterns or comment on performance.</li>
      <li><b>Your judge's book:</b> confirm classes and placements. Verify armbands yourself, mark present juniors with a checkmark and absences ABS, record start and finish times, sign the book, and double-check placements. Ask the Superintendent or Representative rather than improvising a correction.</li>
      <li><b>Ribbons for class placements:</b> 1st rose/pink, 2nd brown, 3rd light green, 4th gray. Award Best Junior first, then bring back the second-place junior from that class for Reserve.</li>
      <li><b>Timing:</b> 20 juniors per hour, which is <b>three minutes per junior</b> (versus two in the breed ring). Re-sorting and individual exam set-up use up much of that extra minute.</li>
     </ul>
     <div class="callout"><b>The guide's math.</b> Entry of 35 juniors (Masters 2, Open Senior 10, Open Intermediate 12, Open Junior 7, Novice Intermediate 1, Novice Junior 3) at 3 minutes each is 1 hour 45 minutes. Re-sorting at about 10 seconds per class and exam set-up at about 10 seconds per junior eats roughly 7 minutes. If the entry is large, <b>simplify rather than rush</b>.</div>` },
   { title:"Are you ready? Saying “not yet”", html:`
     <p>Large Junior Showmanship assignments at major shows are not entry-level. Judges without junior experience risk getting lost in the class, shifting criteria mid-class, over-rewarding flash, and mismanaging time.</p>
     <p><b>A recommended progression:</b></p>
     <ol><li>Local specialty shows (small entries, similar breeds)</li><li>Local all-breed shows (more breeds, manageable classes)</li><li>Larger specialty or group shows</li><li>Medium-sized all-breed shows</li><li>Major shows with large entries or big stakes prizes</li></ol>
     <p><b>Exceptions</b> may include former top-winning juniors with deep understanding of evaluation, professional handlers with extensive junior mentorship, experienced breed judges who can separate technically equal juniors, or mentors who have coached many juniors to high-level success. Even then, they are exceptions, and prior participation alone does not equal readiness.</p>
     <p>Declining an assignment you aren't ready for is <b>professionalism, not failure</b>. Judges owe juniors consistency, preparedness, clear fair evaluation, and understanding of how critical big events are.</p>` }
  ],

function allQuestions(){ const out=[]; MODS.forEach(m=>m.quiz.forEach(q=>out.push(Object.assign({mod:m.id},q)))); return out; }

/* ---------- module / lessons ---------- */
function renderModule(id){
  const m = MODS.find(x=>x.id===id); if(!m){ return renderHome(); }
  const st = ms(id);
  if(CTX.mod !== id){ CTX = { mod:id, i: Math.min(st.lesson||0, m.lessons.length-1) }; }

  h += '<div class="dots" aria-label="Lesson '+(i+1)+' of '+m.lessons.length+'">'+m.lessons.map((_,k)=>'<i class="'+(k<i?'on':k===i?'cur':'')+'"></i>').join("")+'</div>';
  h += '<article class="card"><div class="eyebrow">Lesson '+(i+1)+' of '+m.lessons.length+'</div><h3>'+esc(L.title)+'</h3><div class="body">'+L.html+'<div id="widget"></div></div></article>';
  const last = i === m.lessons.length-1;
  h += '<div class="row"><button class="btn" id="prev"'+(i===0?' disabled':'')+'>Back</button>'+
       (last ? '<button class="btn primary" id="quizgo">Take the module quiz</button>' : '<button class="btn primary" id="next">Next lesson</button>')+'</div>';
  h += '<div class="row" style="justify-content:flex-start"><button class="link" data-go="home">All modules</button></div>';
  $app.innerHTML = h;
  const nx = document.getElementById("next"), pv = document.getElementById("prev"), qg = document.getElementById("quizgo");
  if(nx) nx.onclick = function(){ CTX.i++; renderModule(id); window.scrollTo(0,0); };

function widgetDrill(el){

/* ---------- quiz runner (module quizzes + exam) ---------- */
let QZ = null;
function startModuleQuiz(id){
  const m = MODS.find(x=>x.id===id); if(!m) return renderHome();
  QZ = { kind:"module", mod:id, title:m.title, list: shuffle(m.quiz.map(q=>prep(Object.assign({mod:id},q)))), i:0, picks:[], immediate:true };
  renderQ();
}
function startExam(){
  const pool = shuffle(allQuestions()).slice(0,30);
  QZ = { kind:"exam", title:"Final exam", list: pool.map(prep), i:0, picks:[], immediate:false };
  renderQ();
}
function renderQ(){
  const q = QZ.list[QZ.i], n = QZ.list.length;
  const picked = QZ.picks[QZ.i];
  let h = '<div class="qhead"><span>'+esc(QZ.title)+'</span><span>Question '+(QZ.i+1)+' of '+n+'</span></div><div class="dots">'+QZ.list.map((_,k)=>'<i class="'+(k<QZ.i?'on':k===QZ.i?'cur':'')+'"></i>').join("")+'</div>';
  h += '<article class="card" style="padding-bottom:18px"><div class="qtext">'+esc(q.p)+'</div><div class="choices" id="ch">';
  q.opts.forEach((o,k)=>{ h += '<button class="opt" data-k="'+k+'"><span class="k">'+"ABCD"[k]+'</span>'+esc(o)+'</button>'; });
  h += '</div><div id="fb" aria-live="polite"></div></article>';
  $app.innerHTML = h;
  const btns = $app.querySelectorAll(".opt");
  function lock(k){
    QZ.picks[QZ.i] = k;
    btns.forEach((b,j)=>{ b.disabled = true; });
    if(QZ.immediate){
      btns.forEach((b,j)=>{ if(j===q.ci) b.classList.add("right"); });
      if(k!==q.ci) btns[k].classList.add("wrong");
      document.getElementById("fb").innerHTML = '<div class="why '+(k===q.ci?'ok':'no')+'"><span class="v">'+(k===q.ci?'Correct':'Not quite')+'</span>'+esc(q.why)+'</div>';
    } else { btns[k].classList.add("sel"); }
    const last = QZ.i === n-1;
    document.getElementById("fb").insertAdjacentHTML("beforeend",'<div class="row"><span></span><button class="btn primary" id="nq">'+(last?'Finish':'Next question')+'</button></div>');
    document.getElementById("nq").onclick = function(){ if(last){ finishQuiz(); } else { QZ.i++; renderQ(); window.scrollTo(0,0); } };
  }
  btns.forEach((b,k)=>b.onclick=function(){ if(QZ.picks[QZ.i]===undefined) lock(k); });
  if(picked!==undefined){ /* re-render after nav: not used */ }
}
function finishQuiz(){
  const n = QZ.list.length; let right = 0; const missed = []; const byMod = {};
  QZ.list.forEach((q,k)=>{
    const ok = QZ.picks[k]===q.ci; if(ok) right++; else missed.push({q:q,pick:QZ.picks[k]});
    const b = byMod[q.mod] || (byMod[q.mod]={r:0,n:0}); b.n++; if(ok) b.r++;
  });
  const pct = Math.round(100*right/n), pl = placing(pct);
  if(QZ.kind==="module"){ const st = ms(QZ.mod); st.best = Math.max(st.best||0, pct); st.seen = MODS.find(x=>x.id===QZ.mod).lessons.length; }
  else { S.exam.count++; S.exam.last = pct; S.exam.best = Math.max(S.exam.best, pct); }
  save();
  let h = '<article class="card result"><div class="eyebrow">'+esc(QZ.title)+' result</div><div class="pct">'+pct+'%</div>'+(pl?'<div>'+ribbon(pl,44)+'</div><div class="place">'+PLACE[pl]+'</div>':'<div class="place">Keep studying</div>')+
       '<p>'+right+' of '+n+' correct.'+(QZ.kind==="exam"?(pct>=80?' That clears the 80% pass mark.':' The pass mark is 80%.'):'')+'</p></article>';
  if(QZ.kind==="exam"){
    h += '<h2 class="sec">By module</h2><div class="breakdown">'+Object.keys(byMod).sort((a,b)=>a-b).map(id=>{ const b=byMod[id]; return '<div class="bd"><span class="band">'+id+'</span><span>'+esc(MODS.find(m=>m.id==id).title)+'</span><b>'+b.r+'/'+b.n+'</b></div>'; }).join("")+'</div>';
  }
  if(missed.length){
    h += '<h2 class="sec">Review what you missed</h2>'+missed.map(x=>'<div class="miss"><b>'+esc(x.q.p)+'</b>Your answer: '+(x.pick!==undefined?esc(x.q.opts[x.pick]):'none')+'<br><span class="ok-line">Correct: '+esc(x.q.opts[x.q.ci])+'</span><br>'+esc(x.q.why)+(x.q.mod&&QZ.kind==="exam"?' <button class="link" data-go="module-'+x.q.mod+'">Module '+x.q.mod+'</button>':'')+'</div>').join("");
  } else { h += '<div class="callout"><b>Clean sweep.</b> Nothing to review.</div>'; }
  h += '<div class="row">'+(QZ.kind==="module"?'<button class="btn" id="redo">Retake quiz</button><button class="btn primary" id="nextm">'+(QZ.mod<MODS.length?'Next module':'Final exam')+'</button>':'<button class="btn" data-go="home">Back to modules</button><button class="btn primary" id="redo">New exam</button>')+'</div>';
  $app.innerHTML = h; window.scrollTo(0,0);
  const rd = document.getElementById("redo"), nm = document.getElementById("nextm");
  if(rd) rd.onclick = function(){ if(QZ.kind==="module") startModuleQuiz(QZ.mod); else startExam(); window.scrollTo(0,0); };
  if(nm) nm.onclick = function(){ if(QZ.mod<MODS.length){ CTX={}; go("module-"+(QZ.mod+1)); } else go("exam"); };
}

/* ---------- flashcards ---------- */
let FC = { filter:"all", order:null, i:0, flip:false };
function fcDeck(){
  let idx = CARDS.map((c,k)=>k);
  if(FC.filter==="review") idx = idx.filter(k=>!S.known[k]);
  if(FC.order){ const ord = FC.order.filter(k=>idx.indexOf(k)>-1); idx = ord.concat(idx.filter(k=>ord.indexOf(k)<0)); }
  return idx;
}
function renderCards(){
  const deck = fcDeck(); const known = Object.keys(S.known).filter(k=>S.known[k]).length;
  let h = '<div class="eyebrow">'+CARDS.length+' cards &middot; '+known+' marked known</div><h2 class="sec" style="margin-top:4px">Flashcards</h2>'+
   '<div class="pills"><button class="pill" data-f="all" aria-pressed="'+(FC.filter==="all")+'">All cards</button><button class="pill" data-f="review" aria-pressed="'+(FC.filter==="review")+'">Still learning</button><button class="pill" id="shuf">Shuffle</button><button class="pill" id="rst">Reset progress</button></div>';
  if(!deck.length){
    h += '<article class="card"><h3>Every card is marked known</h3><p>Switch to All cards to keep practicing, or reset progress.</p></article>';
    $app.innerHTML = h; wireCards(deck); return;
  }
  if(FC.i >= deck.length) FC.i = 0;
  const k = deck[FC.i], c = CARDS[k];
  h += '<div class="qhead"><span>Card '+(FC.i+1)+' of '+deck.length+'</span><span>'+(S.known[k]?'Known':'Learning')+'</span></div>'+
   '<button class="fcard '+(FC.flip?'back':'front')+'" id="fc" aria-live="polite"><span class="tag">'+(FC.flip?'Answer':'Prompt')+'</span><span class="txt">'+esc(FC.flip?c[1]:c[0])+'</span></button>'+
   '<p class="hint">Tap the card to '+(FC.flip?'see the prompt':'reveal the answer')+'</p>'+
   '<div class="row"><button class="btn" id="prevc">Previous</button><button class="btn" id="learn">Still learning</button><button class="btn primary" id="know">Got it</button></div>';
  $app.innerHTML = h; wireCards(deck);
}
function wireCards(deck){
  $app.querySelectorAll("[data-f]").forEach(b=>b.onclick=function(){ FC.filter=b.getAttribute("data-f"); FC.i=0; FC.flip=false; renderCards(); });
  const sh = document.getElementById("shuf"); if(sh) sh.onclick=function(){ FC.order = shuffle(CARDS.map((c,k)=>k)); FC.i=0; FC.flip=false; renderCards(); };
  const rs = document.getElementById("rst"); if(rs) rs.onclick=function(){ S.known={}; save(); FC.i=0; FC.flip=false; renderCards(); };
  if(!deck.length) return;
  const k = deck[FC.i];
  const fc = document.getElementById("fc"); if(fc) fc.onclick=function(){ FC.flip=!FC.flip; renderCards(); };
  const nxt = function(){ FC.flip=false; FC.i = (FC.i+1) % Math.max(1,fcDeck().length); renderCards(); };
  const kn = document.getElementById("know"); if(kn) kn.onclick=function(){ S.known[k]=true; save(); if(FC.filter==="review"){ FC.flip=false; renderCards(); } else nxt(); };
  const ln = document.getElementById("learn"); if(ln) ln.onclick=function(){ S.known[k]=false; save(); nxt(); };
  const pv = document.getElementById("prevc"); if(pv) pv.onclick=function(){ FC.flip=false; FC.i = (FC.i-1+deck.length)%deck.length; renderCards(); };
}

/* ---------- scenarios ---------- */
let SC = { i:0, order:null, score:0, answered:false };
function renderScen(){
  if(!SC.order){ SC.order = shuffle(SCEN.map((s,k)=>k)); SC.i=0; SC.score=0; }

    document.getElementById("again").onclick=function(){ SC.order=null; renderScen(); window.scrollTo(0,0); };
    return;
  }
  const s = SCEN[SC.order[SC.i]];
  const opts = shuffle(s.o.map((t,k)=>({t:t,right:k===s.c})));
  let h = '<div class="qhead"><span>Scenario '+(SC.i+1)+' of '+SC.order.length+'</span><span>'+SC.score+' right</span></div><div class="dots">'+SC.order.map((_,k)=>'<i class="'+(k<SC.i?'on':k===SC.i?'cur':'')+'"></i>').join("")+'</div>'+
   '<article class="card" style="padding-bottom:18px"><div class="eyebrow scen-t">You are the judge</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.s)+'</p><div class="choices" id="ch">'+
   opts.map((o,k)=>'<button class="opt" data-k="'+k+'"><span class="k">'+"ABCD"[k]+'</span>'+esc(o.t)+'</button>').join("")+'</div><div id="fb" aria-live="polite"></div></article>';
  $app.innerHTML = h;
  const btns = $app.querySelectorAll(".opt"); let done=false;
  btns.forEach((b,k)=>b.onclick=function(){
    if(done) return; done=true;
    const ok = opts[k].right; if(ok) SC.score++;
    btns.forEach((x,j)=>{ x.disabled=true; if(opts[j].right) x.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    document.getElementById("fb").innerHTML = '<div class="why '+(ok?'ok':'no')+'"><span class="v">'+(ok?'Good call':'Not the best call')+'</span>'+esc(s.why)+'</div><div class="row"><span></span><button class="btn primary" id="ns">'+(SC.i===SC.order.length-1?'See result':'Next scenario')+'</button></div>';
    document.getElementById("ns").onclick=function(){ SC.i++; renderScen(); window.scrollTo(0,0); };
  });
}

/* ---------- boot ---------- */
route();
</script>
</body>
</html>
